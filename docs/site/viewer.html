<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenToy · Interactive viewer</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1117;color:#edf4f6;font:15px/1.4 system-ui}body{height:100dvh;display:flex;flex-direction:column}header{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid #344655}a{color:#b9f3d6}select{font:inherit;background:#182733;color:#fff;padding:8px;border:1px solid #526475;max-width:100%;border-radius:5px}label{display:flex;align-items:center;gap:10px}p{margin:0;padding:8px 22px;color:#bac6cd;font-size:14px}iframe{border:0;flex:1;width:100%;min-height:300px;background:#111}header strong{font-size:19px}a:focus-visible,select:focus-visible{outline:3px solid #ffb17a;outline-offset:4px}@media(max-width:650px){header{padding:10px 14px;gap:10px}label{width:100%}select{flex:1;min-width:0}p{padding:8px 14px}}</style></head><body><header><a href="/"><strong>OpenToy</strong></a><label for="demo">Explore <select id="demo"></select></label><a id="guide" href="{{REPO}}">Project guide</a><a id="direct" href="/">Full-window viewer</a></header><p id="note"></p><iframe id="viewer" title="Interactive OpenToy model" allow="fullscreen" allowfullscreen></iframe><script>const demos={{DEMOS_JSON}};const select=document.getElementById('demo');for(const [key,d] of Object.entries(demos)){select.add(new Option(d.title,key));}function show(key){const d=demos[key]||demos.dithercam;select.value=demos[key]?key:'dithercam';document.title=d.title+' · OpenToy';document.getElementById('note').textContent=d.note;document.getElementById('viewer').src=d.path;document.getElementById('viewer').title=d.title;document.getElementById('guide').href='{{REPO}}/blob/main/'+d.guide;document.getElementById('direct').href=d.path;}show(new URLSearchParams(location.search).get('demo'));select.addEventListener('change',()=>{history.replaceState(null,'','?demo='+select.value);show(select.value)});</script></body></html>
